<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background clip</title>
    <style>
        div{
            width: 600px;
            height: 400px;
            background: url("flower.jpg") no-repeat;
            background-size: cover;
            font-size: 50px;
            font-family: Impact;
            text-align: center;
            background-clip: text;
            -webkit-background-clip: text;
        }
    </style>
</head>
<body>
    <h1>Learning Background clip</h1>
<div>HELLO TEAM</div>
    </body>
</html>
