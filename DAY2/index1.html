<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            padding: 10px;            background-size: cover;
            opacity: 0.3;
            filter: alpha(opacity=30); /*For IE8 And Earlier*/
        }

        h2{
            letter-spacing: 5px;
            word-spacing: 10px;
            text-decoration:line-through;
        }
        h3{
            text-decoration: underline overline;
        }

    </style>
</head>
<body>
    <h2>Opacity, text properties</h2>
    <p>Hello Team</p>
    <h3>I am Deepika Sasikumar</h3>
    <div>
        <img src="flower.jpg" alt="not found">
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aspernatur, ratione. Laudantium laborum, repellat adipisci enim assumenda esse dolorum eveniet id quod, quisquam voluptas distinctio quaerat. Rerum assumenda commodi debitis quos?</p>
    </div>
</body>
</html>
